<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heating Web App</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <button id="menu-btn" class="ghost icon-btn hidden" aria-label="Open menu">☰</button>
        <h1>Heating Web App</h1>
        <div></div>
      </header>

      <aside id="side-nav" class="side-nav hidden" aria-hidden="true">
        <div class="side-nav-header">
          <strong>Menu</strong>
          <button id="menu-close-btn" class="ghost icon-btn" aria-label="Close menu">✕</button>
        </div>
        <div class="side-nav-body">
          <button id="logout-btn" class="ghost nav-btn">Log out</button>
        </div>
      </aside>
      <div id="side-nav-backdrop" class="side-nav-backdrop hidden"></div>

      <section id="login-section" class="card">
        <h2>Sign in</h2>
        <form id="login-form" class="form">
          <label>Email <input id="email" type="email" required /></label>
          <label>Password <input id="password" type="password" required /></label>
          <button type="submit">Sign in</button>
        </form>
      </section>

      <section id="dashboard-section" class="hidden">
        <div id="pull-indicator" class="pull-indicator">Pull to refresh</div>
        <div id="status" class="status"></div>
        <div id="zones" class="grid"></div>
        <div id="hot-water" class="grid"></div>
      </section>

      <section id="zone-section" class="hidden">
        <div class="card toolbar">
          <button id="zone-back-btn" class="ghost">Back</button>
          <h2 id="zone-title">Zone</h2>
          <button id="zone-refresh-btn" class="ghost">Refresh</button>
        </div>
        <div class="card zone-detail">
          <div class="zone-metrics">
            <div>
              <div class="muted">Current</div>
              <div id="zone-current-temp" class="temp-big">--.-°C</div>
            </div>
            <div>
              <div class="muted">Target</div>
              <div id="zone-target-temp" class="temp-big">--.-°C</div>
            </div>
          </div>
          <div class="zone-state-row">
            <span class="muted">State</span>
            <strong id="zone-heating-state">Unknown</strong>
          </div>
          <div class="zone-control">
            <label for="zone-target-input">Set target (°C)</label>
            <div class="row">
              <input id="zone-target-input" class="target-input" type="number" step="0.5" min="5" max="35" />
              <button id="zone-set-btn">Set target</button>
            </div>
            <input id="zone-target-range" type="range" min="5" max="35" step="0.5" />
          </div>
        </div>
      </section>
    </main>

    <script src="/main.js"></script>
  </body>
</html>
