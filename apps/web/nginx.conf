server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:3001/;
    proxy_http_version 1.1;
    # Provider requests may try eight WebSocket variants at 12 seconds each.
    proxy_read_timeout 120s;
    error_page 502 = @api_unavailable;
    error_page 504 = @api_timeout;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location @api_unavailable {
    default_type application/json;
    return 502 '{"ok":false,"error":"The heating service is temporarily unavailable. Please try again."}';
  }

  location @api_timeout {
    default_type application/json;
    return 504 '{"ok":false,"error":"The heating system took too long to respond. Please try again."}';
  }

  location / {
    try_files $uri /index.html;
  }
}
